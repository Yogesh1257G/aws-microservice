name: CI/CD - AWS Microservice

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest -v --cov=. --cov-fail-under=80

    - name: Build Docker image
      run: docker build -t aws-microservice:latest .

    - name: Test Docker image
      run: |
        docker run -d --name test-container -p 8001:8000 aws-microservice:latest
        sleep 5
        curl -f http://localhost:8001/health || exit 1
        docker stop test-container
        docker rm test-container

    - name: Success
      if: success()
      run: echo "✅ All tests passed. Docker image builds successfully. Ready for ECR + ECS deployment."
